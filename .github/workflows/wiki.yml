name: wiki
# Publishes wiki/ to the repository's GitHub wiki. The wiki is a separate git repository that GitHub only creates once the
# first page exists, so if it is not there yet this job says so and stops without failing.
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet "$url" _wiki 2>/dev/null; then
            echo "::warning::The wiki repository does not exist yet. Create the first page once in the GitHub wiki tab (Wiki > Create the first page), then re-run this workflow."
            exit 0
          fi
          # Mirror wiki/ exactly (pages deleted from wiki/ are removed from the wiki too).
          find _wiki -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r wiki/. _wiki/
          cd _wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit --quiet -m "Sync wiki from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD
