name: curseforge
# Uploads the jars of a GitHub release to CurseForge. Runs after every release, and by hand (Actions > curseforge > Run
# workflow) to retry or to upload an older tag. Does nothing, and succeeds, until the CURSEFORGE_TOKEN secret and the
# CURSEFORGE_PROJECT_ID variable exist.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, e.g. v0.3.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the release jars
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern 'landmark-*.jar' --dir jars
      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          TAG: ${{ inputs.tag }}
        run: node tools/curseforge-upload.js "$TAG" jars
