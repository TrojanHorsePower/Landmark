plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	mavenCentral()
	// Mod Menu: optional integration only (compile-time API), see LandmarkModMenu
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
	// JourneyMap API: optional integration only (compile-time API, never bundled), see LandmarkJourneyMapPlugin
	maven {
		name = 'JourneyMap'
		url = 'https://maven.blamejared.com'
		content {
			includeGroup 'info.journeymap'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Landmark runs without JourneyMap. compileOnly is never packaged into the jar.
	compileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"

	// Optional: Landmark runs without Mod Menu. compileOnly is not packaged; runtimeOnly only affects the dev client.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// ./gradlew runClient -PnoModMenu starts the dev client without Mod Menu, to check the mod works without it
	if (!project.hasProperty("noModMenu")) {
		runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	}

	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	// The in-game help screen copies this script to the clipboard; tools/export.js stays the single source.
	from('tools/export.js') {
		into 'assets/landmark'
	}
	def v = project.version
	inputs.property "version", v
	filesMatching("fabric.mod.json") {
		expand "version": v
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.base.archivesName.get()
	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}

test {
	useJUnitPlatform()
}
